[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-sherpa"
version = "0.1.0"
description = "Doc Sherpa — self-hosted document classification + routing pipeline (training-service + runtime-engine)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Luke Arpey" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Default-recommended OCR stack. ONNX-based, multi-threaded, no system deps.
# Pull this in unless you specifically want the tesseract path.
rapidocr = [
    "rapidocr-onnxruntime>=1.3",
    "pypdfium2>=4.20",
]
# Legacy OCR path — requires the host's tesseract binary on PATH.
# Kept as an opt-in so installs that already have tesseract can use it.
tesseract = [
    "ocrmypdf>=16.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "reportlab>=4.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "coverage[toml]>=7.6",
]

[tool.setuptools.packages.find]
where = ["training-service", "runtime-engine", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["training_service", "runtime_engine", "shared"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Target: 70%+ on new code (per CLAUDE.md). Build doesn't fail on this — it's
# a measure of conscientiousness, not a gate.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter, not lint

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_explicit = false  # allow `Any` only with explicit justification
